<svg width="120" height="120" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">

  <!-- Back frame -->
  <rect x="10" y="10" width="76" height="76" rx="12" fill="#534AB7"/>

  <!-- Front frame -->
  <rect x="34" y="34" width="76" height="76" rx="12" fill="#7F77DD"/>

  <!-- Clipped content inside front frame -->
  <clipPath id="frameClip">
    <rect x="34" y="34" width="76" height="76" rx="12"/>
  </clipPath>
  <g clip-path="url(#frameClip)">
    <!-- Mountains -->
    <polygon points="46,100 72,58 98,100" fill="white" opacity="0.95"/>
    <polygon points="72,100 90,72 108,100" fill="white" opacity="0.6"/>
    <!-- Sun -->
    <circle cx="96" cy="52" r="10" fill="white" opacity="0.95"/>
  </g>

</svg>
